[workspace]
resolver = "2"
members = [
    "crates/tack-core",
    "crates/tack-db",
    "crates/tack-api",
    "crates/tack-cli",
    "crates/tack-orch",
    "crates/tack-runner",
    "crates/tack-test-support",
]
# tack-desktop is a workspace of its own, on purpose. Tauri drags GTK, WebKit
# and glib into whatever workspace contains it, so as a member it made every
# `cargo build --workspace` — including the MSRV job and the musl release build
# for headless hosts — require desktop system libraries. Building the desktop
# app is `make desktop`; `cargo` at this level never sees it.
exclude = ["crates/tack-desktop"]

[workspace.package]
version = "0.1.0-beta.8"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Tack Contributors"]
repository = "https://github.com/yielab/tack"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
# OpenAPI contract generation (compile-time; no bundled Swagger UI to protect the
# binary-size budget — only the raw spec JSON is served). chrono/uuid map the
# domain timestamp + id types into the schema.
utoipa = { version = "5", features = ["chrono", "uuid"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "compression-gzip", "set-header"] }
validator = { version = "0.21", features = ["derive"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Distinguish "field absent" from "field set to null" in PATCH bodies via
# double-Option (`Option<Option<T>>`) with `serde_with::rust::double_option`.
serde_with = { version = "3", default-features = false, features = ["std"] }
# YAML project export/import (plaintext, git-diffable round-trip). serde_yaml is
# feature-frozen but stable and the de-facto standard for serde<->YAML.
serde_yaml = "0.9"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait methods on object-safe traits (async fn in traits still can't
# return a dyn-compatible future on its own) — used by tack-orch's
# ControlPlane trait.
async-trait = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "1.1"
futures = "0.3"
regex = { version = "1", features = ["std"] }

# HTTP client (webhook delivery)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Remote backup — S3-compatible object storage + compression
object_store = { version = "0.14", features = ["aws"] }
tar = "0.4"
zstd = "0.13"

# Cryptography (HMAC-SHA256 webhook signatures)
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Testing
assert_matches = "1.5"
# Every temporary path a test needs. The directory is deleted when the guard
# drops, so a panicking test cleans up too, and anything the code under test
# writes *beside* the path it was given — SQLite's `-wal` and `-shm`, the
# migration runner's pre-upgrade snapshot — dies with the directory instead of
# having to be named. Hand-rolled `env::temp_dir().join(unique_name)` cannot do
# either, which is why it is rejected by `scripts/check-test-hygiene.sh`.
tempfile = "3"
# Mock HTTP server for adapter tests (tack-orch's DocketAdapter, docket.rs —
# same crate tack-api's github_sync push tests already use).
wiremock = "0.6"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"  # Optimize for size

[profile.dev]
opt-level = 0
# Line tables only: a backtrace still shows file:line, and full debuginfo is
# ~85% of every test binary's size for nothing here that reads it.
debug = "line-tables-only"

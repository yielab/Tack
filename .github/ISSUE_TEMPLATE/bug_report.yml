name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Tack version / commit
      placeholder: "e.g. 0.1.0 or git sha"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any error messages or log output.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cargo run -p tack-cli -- serve
        2. POST /api/projects ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Rust version
      placeholder: "e.g. Ubuntu 24.04, rustc 1.78"

  - type: checkboxes
    id: checked-existing
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find this already reported
          required: true

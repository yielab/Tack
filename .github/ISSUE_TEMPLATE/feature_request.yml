name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or workflow gap is this addressing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this yourself?
      description: >-
        No pressure either way — this just helps a one-maintainer project prioritize.
        If yes, mention it and CONTRIBUTING.md has the setup + PR process.
      options:
        - "Not sure yet"
        - "No, just suggesting it"
        - "Yes, I'd like to open a PR for this"
      default: 0

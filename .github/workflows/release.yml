name: Release

# Builds single-binary distributions (server with embedded SPA + CLI) for
# Linux, macOS (Intel + Apple Silicon), and Windows, then attaches them to a
# GitHub Release together with a SHA256SUMS checksum file, SBOMs (CycloneDX),
# and build-provenance attestations. Triggered by pushing a version tag:
#
#   git tag v0.1.0-beta.7 && git push origin v0.1.0-beta.7

on:
  push:
    tags: ["v*"]
  # Lets a card branch or a maintainer trigger a real run of the build/bundle
  # jobs (e.g. to verify a change to this file) without pushing a version tag.
  # `check-version` skips its tag/version match outside a tag push, and
  # `release`/`container` refuse to run at all — a workflow_dispatch run
  # never creates a GitHub Release or publishes a container image.
  workflow_dispatch:

# One run per tag — re-pushing a tag after a failed release (a real thing
# that has happened) cancels the run it superseded instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Read-only by default. Only `release` (creates the GitHub Release, signs
# provenance) and `container` (pushes to ghcr.io) need to write anything, and
# each already declares its own scoped `permissions:` block below — a job's
# own block replaces this default rather than adding to it, so this stays the
# floor for check-version/test/sbom/build, which only read.
permissions:
  contents: read

# Non-Windows steps run under bash with `set -euo pipefail` as the first line
# of every multi-line `run:` block (the pwsh packaging step below is the one
# documented exception — PowerShell has its own error-stop semantics).
defaults:
  run:
    shell: bash

jobs:
  check-version:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify versions match
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag push (event: ${{ github.event_name }}) — skipping the tag/version check."
            exit 0
          fi
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $CARGO_VERSION — tag: $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match workspace version $CARGO_VERSION"
            exit 1
          fi

  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install nextest (prebuilt)
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: nextest
      - name: Test
        run: cargo nextest run --workspace --profile ci

  sbom:
    name: Software Bill of Materials (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate Rust SBOM (workspace dependencies)
        run: cargo cyclonedx --format json --all
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate frontend SBOM
        working-directory: frontend
        run: npm sbom --sbom-format cyclonedx > frontend.cdx.json
      - name: Collect SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          # cargo-cyclonedx writes <crate>.cdx.json next to each crate manifest.
          find . -name '*.cdx.json' -not -path './sbom/*' -exec cp {} sbom/ \;
          ls -la sbom/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `GITHUB_REF_NAME` is a clean tag ("v0.1.0-beta.7") on every real release
      # trigger (a tag push) but is the branch name on a `workflow_dispatch` dry
      # run, e.g. "agent/vii-c1-release-bundles" — with a "/" in it, `mkdir`
      # (below) and `New-Item` read that as a directory separator and fail or
      # nest unexpectedly. Substituted only when a "/" is present, so a real
      # tag's staged directory/asset names are byte-identical to before.
      - name: Compute a filesystem-safe ref name for staging directories
        run: echo "SAFE_REF_NAME=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `targets:` above adds the target to the toolchain this action resolves and
      # installs (named `stable`) — not to the toolchain `rust-toolchain.toml` pins,
      # which rustup's directory-scoped override makes the one cargo actually uses
      # once the repo is checked out. Unqualified, this adds it to whatever's active
      # here, which is the pinned toolchain.
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # cargo-auditable embeds the dependency list into the binary so it can be
      # audited after the fact (`cargo audit bin tack`).
      - name: Install cargo-auditable
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-auditable

      - name: Build release binary (auditable)
        run: cargo auditable build --release --target ${{ matrix.target }} -p tack-cli --features embed-spa

      # tack-runner is a separate binary from `tack` (CLAUDE.md) — its own release
      # archive so an operator provisioning a fleet host doesn't need the whole
      # server/SPA bundle. Same auditable-build treatment as `tack`.
      - name: Build tack-runner release binary (auditable)
        run: cargo auditable build --release --target ${{ matrix.target }} -p tack-runner

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          STAGE="tack-${SAFE_REF_NAME}-${{ matrix.platform }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/tack" "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          cat > "$STAGE/QUICKSTART.txt" <<'EOF'
          Tack — Quick Start
          ====================

          1. Start the app:         ./tack
          2. Open your browser at:  http://localhost:3210
          3. Stop with Ctrl+C.

          Your data is stored in tack.db (and ./storage for attachments)
          in the directory where you run it. Keep those files to keep
          your projects.

          The same binary is also an optional command-line client:
          run "./tack --help" (while the app is running) to see the
          commands — e.g. "./tack add", "./tack list".
          EOF
          tar czf "$STAGE.tar.gz" "$STAGE"
          echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"

          RUNNER_STAGE="tack-runner-${SAFE_REF_NAME}-${{ matrix.platform }}"
          mkdir "$RUNNER_STAGE"
          cp "target/${{ matrix.target }}/release/tack-runner" "$RUNNER_STAGE/"
          cp LICENSE "$RUNNER_STAGE/"
          cp packaging/systemd/tack-runner.service packaging/systemd/tack-runner.env.example "$RUNNER_STAGE/"
          cat > "$RUNNER_STAGE/QUICKSTART.txt" <<'EOF'
          tack-runner — Quick Start
          ====================

          tack-runner is the pull-based execution runner. It is a SEPARATE
          binary from `tack` (the API server / CLI) — install it on any
          machine that should execute agent work, not necessarily the one
          running the Tack server.

          1. Set required configuration (see docs/CONFIG.md for the full
             table): TACK_RUNNER_API_URL, TACK_RUNNER_ENROLLMENT_TOKEN.
          2. Start it:  ./tack-runner
          3. Stop with Ctrl+C (drains in-flight work before exiting).

          A systemd unit template and environment-file example are included
          (tack-runner.service, tack-runner.env.example) for running this as
          a long-lived service — see the comments in tack-runner.service for
          install steps.
          EOF
          tar czf "$RUNNER_STAGE.tar.gz" "$RUNNER_STAGE"
          echo "RUNNER_ASSET=$RUNNER_STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "tack-$env:SAFE_REF_NAME-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tack.exe" $stage
          Copy-Item LICENSE, README.md $stage
          @"
          Tack — Quick Start
          ====================

          1. Double-click tack.exe (a console window opens).
          2. Open your browser at:  http://localhost:3210
          3. Close the console window to stop.

          If Windows SmartScreen warns about an unrecognized app, click
          "More info" then "Run anyway".

          Your data is stored in tack.db (and the storage folder for
          attachments) next to the .exe. Keep those files to keep your
          projects.

          The same binary is also an optional command-line client:
          run "tack.exe --help" (while the app is running) to see the
          commands — e.g. "tack.exe add", "tack.exe list".
          "@ | Set-Content "$stage/QUICKSTART.txt"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

          $runnerStage = "tack-runner-$env:SAFE_REF_NAME-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $runnerStage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tack-runner.exe" $runnerStage
          Copy-Item LICENSE $runnerStage
          @"
          tack-runner — Quick Start
          ====================

          tack-runner is the pull-based execution runner. It is a SEPARATE
          binary from tack.exe (the API server / CLI) — install it on any
          machine that should execute agent work.

          1. Set required configuration (see docs/CONFIG.md for the full
             table): TACK_RUNNER_API_URL, TACK_RUNNER_ENROLLMENT_TOKEN.
          2. Run tack-runner.exe (a console window opens).
          3. Close the console window to stop.

          A systemd unit template is provided for Linux hosts under
          packaging/systemd/ in the source repository; on Windows, run this
          as a scheduled task or via NSSM / a similar service wrapper.
          "@ | Set-Content "$runnerStage/QUICKSTART.txt"
          Compress-Archive -Path $runnerStage -DestinationPath "$runnerStage.zip"
          "RUNNER_ASSET=$runnerStage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.ASSET }}
            ${{ env.RUNNER_ASSET }}
          if-no-files-found: error

  # ADR 0062 decision 7: the app ships for all three desktop OSes next to the
  # server/CLI archives `build` produces above, unsigned. `ci.yml`'s `desktop`
  # job only checks the crate compiles (no system libs for bundling there);
  # this one installs them and actually runs `cargo tauri build`.
  desktop:
    name: Desktop app bundle (${{ matrix.platform }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: desktop-linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: desktop-macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: desktop-macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: desktop-windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `targets:` above adds the target to the toolchain this action resolves and
      # installs (named `stable`) — not to the toolchain `rust-toolchain.toml` pins,
      # which rustup's directory-scoped override makes the one cargo actually uses
      # once the repo is checked out. Unqualified, this adds it to whatever's active
      # here, which is the pinned toolchain.
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            .
            crates/tack-desktop
          key: ${{ matrix.platform }}

      # Same packages as ci.yml's `desktop` job, on the same runner image the
      # dispatch checklist verified them against (docs/agent-handoffs/part-vii/README.md).
      - name: Install Tauri's Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build tack sidecar
        run: cargo build --release --target ${{ matrix.target }} -p tack-cli --features embed-spa

      # Tauri's `externalBin` resolves `binaries/tack` (tauri.bundle.conf.json)
      # to `binaries/tack-<target-triple>`, `.exe`-suffixed on Windows.
      - name: Stage sidecar for Tauri externalBin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/tack-desktop/binaries
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/tack$EXT" \
             "crates/tack-desktop/binaries/tack-${{ matrix.target }}$EXT"

      # MSI's ProductVersion is numeric-only (major.minor.patch.build, each field
      # capped, per WixConfig.version — https://v2.tauri.app/reference/config/#wixconfig)
      # and the workspace version is `0.1.0-beta.7` — a non-numeric prerelease
      # identifier, so Tauri's own major.minor.patch fallback derivation rejects it.
      # `bundle.windows.wix.version` overrides just the MSI installer's internal
      # version; `tauri.conf.json`'s own `version` (shown everywhere else — the CLI,
      # the archives, the in-app version) is never touched. The prerelease counter
      # becomes the build field (`beta.7` -> `.7`) so beta releases keep a strictly
      # increasing ProductVersion, which Windows Installer needs to recognize an
      # upgrade; a version with no prerelease passes through unchanged.
      - name: Set the MSI ProductVersion (bundle.windows.wix.version)
        if: matrix.os == 'windows-latest'
        working-directory: crates/tack-desktop
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(grep -m1 '^version' ../../Cargo.toml | cut -d'"' -f2)
          BASE="${WORKSPACE_VERSION%%-*}"
          if [ "$BASE" != "$WORKSPACE_VERSION" ]; then
            PRE="${WORKSPACE_VERSION#*-}"
            BUILD_NUM="${PRE##*.}"
            case "$BUILD_NUM" in
              ''|*[!0-9]*)
                echo "Prerelease '$PRE' has no trailing numeric field — refusing to guess an MSI ProductVersion for it." >&2
                exit 1
                ;;
            esac
            WIX_VERSION="${BASE}.${BUILD_NUM}"
          else
            WIX_VERSION="$BASE"
          fi
          echo "Workspace version $WORKSPACE_VERSION -> MSI ProductVersion $WIX_VERSION"
          jq --arg v "$WIX_VERSION" '.bundle.windows.wix.version = $v' tauri.bundle.conf.json > tauri.bundle.conf.json.tmp
          mv tauri.bundle.conf.json.tmp tauri.bundle.conf.json

      - name: cargo tauri build
        working-directory: crates/tack-desktop
        run: |
          cargo tauri build --config tauri.bundle.conf.json \
            --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stage bundle output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-desktop
          find crates/tack-desktop/target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' \) \
            -exec cp {} dist-desktop/ \;
          ls -la dist-desktop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: dist-desktop/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [test, sbom, build, desktop]
    # Never on a workflow_dispatch run (used to test-drive this file on a
    # branch) — only a real version-tag push creates a release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the release
      id-token: write        # OIDC token for provenance signing
      attestations: write    # write build-provenance attestations
    steps:
      # Explicit pattern, not "download everything": docker/build-push-action
      # (the `container` job) auto-uploads its own internal build-record
      # artifact (named `<owner>~<repo>~<random>.dockerbuild`, for its own
      # provenance/cache use) as a side effect — it isn't a release asset,
      # and downloading it here failed outright once (unrelated to anything
      # actually being released).
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
          pattern: "{linux-x86_64,macos-aarch64,macos-x86_64,windows-x86_64,desktop-linux,desktop-macos-aarch64,desktop-macos-x86_64,desktop-windows,sbom}"

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # Checksum every release asset (archives + SBOMs), excluding the
          # checksum file itself. Consumers verify with `sha256sum -c SHA256SUMS`.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

      - name: Attest build provenance for release binaries
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          # ADR 0062 decision 7: desktop bundles are unsigned (signing needs a
          # paid certificate, a separate decision) — `body` is a fixed prefix,
          # softprops/action-gh-release appends the auto-generated notes after it.
          body: |
            The desktop app (`.deb`, `.AppImage`, `.dmg`, `.msi` below) is unsigned:
            signing certificates are a separate, not-yet-made decision. Two
            one-time warnings to expect on first launch:

            - **macOS:** Gatekeeper blocks the unsigned app on a normal double-click.
              Right-click (or Control-click) the app → **Open** → **Open** in the
              dialog. Only needed once.
            - **Windows:** SmartScreen will warn about an unrecognized app. Click
              **More info** → **Run anyway**. Only needed once.
          # Tags with a pre-release suffix (v0.1.0-beta.7) are marked as
          # GitHub pre-releases and excluded from /releases/latest.
          prerelease: ${{ contains(github.ref_name, '-') }}

  container:
    name: Publish container image (ghcr.io)
    needs: [check-version, test]
    # Never on a workflow_dispatch run — only a real version-tag push
    # publishes an image.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"
          tags="$image:${GITHUB_REF_NAME}"
          # Same rule release uses for GitHub's prerelease flag: a tag with a
          # pre-release suffix (v0.1.0-beta.7) stays pinned-only so `latest`
          # never points at a beta.
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags="$(printf '%s\n%s' "$tags" "$image:latest")"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # The Dockerfile's backend stage hardcodes TARGET to
      # x86_64-unknown-linux-musl rather than deriving it from buildx's
      # target platform, so this publishes linux/amd64 only — a multi-arch
      # manifest would need the Dockerfile to select the Rust target from
      # $TARGETARCH first.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}

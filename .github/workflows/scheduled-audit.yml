name: Scheduled audit

# Weekly dependency-vulnerability sweep, independent of pushes/PRs so newly
# disclosed advisories are caught even when the code hasn't changed. Mirrors the
# `security` job in ci.yml. Also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Dependency audit (cargo + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-audit
      - name: Rust dependency audit (honors .cargo/audit.toml)
        run: cargo audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: npm dependency audit (fail on high+)
        working-directory: frontend
        run: npm audit --audit-level=high

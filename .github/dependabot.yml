version: 2

# Noise policy (solo maintainer, three board cycles in parallel).
#
# Two things are true at once here, and the config has to keep them apart:
#
#   * Version updates are chores. They earn their keep in bulk, and a weekly
#     cadence produced PRs faster than anyone decided on them — three majors sat
#     open for up to two weeks. They are grouped, monthly, and given a cooldown
#     so a freshly published version is not this repository's problem to
#     discover.
#   * Security updates are not chores. They are triggered by advisory
#     disclosures, ignore `schedule` and `cooldown` entirely, and get their own
#     group per ecosystem via `applies-to: security-updates` — otherwise they
#     would inherit the batching built to slow chores down.
#
# Turning `dependabot_security_updates` on at the repository level is what makes
# the second half exist at all; without it, advisories were only ever fixed as a
# side effect of a routine version-update roll-up.
#
# Majors are grouped separately from minor/patch on purpose: a breaking major
# must never block the routine patch roll-up behind it. Only minor/patch is
# auto-merged (see .github/workflows/dependabot-auto-merge.yml); majors wait for
# a human.
updates:
  # Rust crates
  - package-ecosystem: cargo
    directory: "/"
    # Target the integration branch, not whatever the default branch happens
    # to be — auto-merge must go through the same line every card does, never
    # land directly on `main` behind its back (see the dtolnay/rust-toolchain
    # incident below for what happens when it doesn't).
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # tack-desktop is its own workspace (see the `exclude` in the root Cargo.toml),
  # so its lockfile is invisible to the entry above and needs its own.
  - package-ecosystem: cargo
    directory: "/crates/tack-desktop"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      desktop-minor-patch:
        update-types: ["minor", "patch"]
      desktop-major:
        update-types: ["major"]
      desktop-security:
        applies-to: security-updates
        patterns: ["*"]

  # Frontend npm packages
  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # openapi-typescript (every release through 7.13.0, including the 7.0.0-rc.1
      # "next" line) pins its typescript peer at ^5.x. Forcing a TS 7 major here
      # would ERESOLVE against that generator on every install. Remove this once
      # a released openapi-typescript widens the peer range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The pinned Rust toolchain (rust-toolchain.toml). Pinning exactly is what keeps
  # local builds and CI on the same compiler; this entry is what keeps the pin
  # from going stale. A bump can surface new clippy lints, so it is never
  # auto-merged — `dependabot-auto-merge.yml` only takes minor and patch, and a
  # toolchain bump lands as a human decision either way.
  - package-ecosystem: rust-toolchain
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  # GitHub Actions — these move slowly and are almost always safe to take in bulk.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # dtolnay/rust-toolchain's "version" isn't an action release — it's the
      # Rust channel/version each job's `uses:` line selects (@stable, or the
      # exact patch pinned for the MSRV floor). Dependabot once bumped the
      # MSRV job's pin to a much newer Rust as a routine "minor" action bump
      # and auto-merged it, silently defeating that job's entire purpose
      # (testing the documented floor in Cargo.toml/README/CONTRIBUTING, not
      # the latest). This pin only ever changes as a deliberate, coordinated
      # decision — never automated.
      - dependency-name: "dtolnay/rust-toolchain"

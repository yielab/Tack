# Its own workspace, not a member of the root one: see the `exclude` comment in
# ../../Cargo.toml. The values below are duplicated from the root
# `[workspace.package]` rather than inherited; `tests/dependency_boundary.rs`
# fails if the version drifts from it.
[workspace]

[package]
name = "tack-desktop"
description = "Desktop app that supervises the tack server as a background process"
version = "0.1.0-beta.8"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/yielab/tack"

[[bin]]
name = "tack-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Never tack-api, tack-db, tack-orch or tack-runner: this crate supervises the
# bundled `tack` binary as a subprocess and speaks to it over HTTP only.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
cargo_metadata = "0.19"

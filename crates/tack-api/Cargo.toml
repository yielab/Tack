[package]
name = "tack-api"
description = "HTTP API server for Tack"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Embed the pre-built SPA into the binary for single-binary distribution.
# Requires `frontend/dist/` to exist at compile time (`npm run build`).
embed-spa = ["dep:rust-embed"]

[dependencies]
# Optional: embed frontend/dist/ into the binary at compile time
rust-embed = { version = "8", optional = true }
tack-core = { path = "../tack-core", features = ["openapi"] }
tack-db = { path = "../tack-db" }
# Orchestration reconciler spawn (card A2, 33.6) — see server.rs. Also used
# by router.rs/config.rs/handlers/orch.rs (card A4, control-plane API) and
# orch_store.rs (card A7, the real ControlPlaneStore backed by tack-db).
tack-orch = { path = "../tack-orch" }
# For the `ControlPlaneStore` impl in orch_store.rs — `tack-orch`'s
# `ControlPlaneStore` trait is `#[async_trait]`, so implementors need the
# same macro.
async-trait = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
validator = { workspace = true }
reqwest = { workspace = true }
object_store = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tack-test-support = { path = "../tack-test-support" }
# Mock GitHub's HTTP API in github_sync push tests
wiremock = "0.6"
tempfile = { workspace = true }
